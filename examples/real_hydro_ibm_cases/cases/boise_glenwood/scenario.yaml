ibm_version: '0.2'
scenario:
  id: boise_glenwood-real-hydro-ibm
  description: 'Boise River at Glenwood Bridge near Boise, Idaho: NWIS/NHD real-data
    hydraulic + IBM smoke case.'
  reach_id: boise_glenwood
  days: 7
  start_day: 274
  start_year: 2025
  seed: 13206000
  stochastic: true
  light_phases:
  - dawn
  - day
  - dusk
  - night
profile:
  uri: profile_rainbow_trout.yaml
forcing:
  habitat_cells: data/hydraulics/hydraulic_cells.csv
  time_index_column: time_index
population:
  initial_population: data/initial_population.csv
  default_species: rainbow_trout
  initial_abundance: 160
  initial_length_mm: 115.0
outputs:
  dir: out/native
  formats:
  - csv
  individual_history: false
  manifest: true
