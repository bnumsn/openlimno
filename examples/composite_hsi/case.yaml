# composite_hsi example case — v2.7.x dual-raster YAML-driven per-cell
# composite end-to-end demo.
#
# Reuses the Lemhi hydraulic/HSI fixtures (cross-section, HSI curves,
# species, life-stage, etc.) and layers the new v2.6/v2.7 raster overlays
# on top:
#
#   data.thermal_raster        — 12×12 GeoTIFF (°C), v2.6.0 inline path.
#   data.cover_raster          — 12×12 LULC, v2.7.0 inline path.
#   data.section_locations     — per-section (lon, lat) for inline sampling.
#   data.fishbase_traits       — ThermalRange driver for thermal raster.
#   habitat.composite_overlay_method = geom_mean_per_cell — v2.4.0 path.
#
# What this case demonstrates:
#
#   1. Cell-level depth × velocity CSI from the 1D builtin solver.
#   2. Inline thermal SI per section (raster sampled at each station's
#      lon/lat → SI via ThermalRange from FishBase traits).
#   3. Inline cover SI per section (LULC code at each station's lon/lat
#      → SI via DEFAULT_RIPARIAN_COVER_SI lookup).
#   4. True 4-way per-cell geometric-mean composite via
#      apply_overlay_per_cell((d × v × c × t)^(1/4) per cell).
#
# All inputs are checked into the repo — running `python quickstart.py`
# from this directory exercises the full chain offline in <2 s.
openlimno: '0.1'

case:
  name: composite_hsi_dual_raster
  description: >
    v2.7.x dual-raster (thermal + cover) per-cell composite demo.
    Heihe mid-basin (38.20 °N, 100.20 °E) overlay applied to the
    Lemhi PHABSIM-equivalent hydraulic fixture. Synthetic thermal
    and cover rasters illustrate the inline per-section sampling
    path closed by v2.6.0 + v2.7.0.
  crs: EPSG:4326

mesh:
  uri: ../../data/lemhi/mesh.ugrid.nc
  time_varying: false

data:
  # Hydraulic + habitat inputs — reused from the Lemhi fixture so this
  # example only ships the new v2.7.x raster artefacts under ./data/.
  cross_section: ../../data/lemhi/cross_section.parquet
  hsi_curve: ../../data/lemhi/hsi_curve.parquet
  hsi_evidence: ../../data/lemhi/hsi_evidence.parquet
  species: ../../data/lemhi/species.parquet
  life_stage: ../../data/lemhi/life_stage.parquet
  rating_curve: ../../data/lemhi/Q_2024.csv

  # v2.6.0 inline thermal path: GeoTIFF + per-section (lon, lat) +
  # FishBase ThermalRange.
  thermal_raster:
    uri: ./data/thermal_C.tif
    band: 1
    source_citation: synthetic 8..14 °C east-west gradient
  # v2.10.1 R11-1: aligned to habitat.species (oncorhynchus_mykiss).
  # Pre-v2.10.1 the example mixed rainbow-trout habitat with
  # Schizothorax prenanti thermal traits — internally incoherent.
  # FishBase ECOL_009 for O. mykiss: 0..25 °C survival range.
  fishbase_traits:
    scientific_name: Oncorhynchus mykiss
    temperature_min_C: 0.0
    temperature_max_C: 25.0

  # v2.7.0 inline cover path: LULC GeoTIFF + same per-section locations.
  cover_raster:
    uri: ./data/cover_lulc.tif
    band: 1
    source_citation: >
      synthetic mix of tree(10), shrub(20), grass(30), bare(60) classes;
      symbolic stand-in for an ESA WorldCover tile clipped to a real
      Heihe riparian buffer.

  # Per-section (lon, lat) anchors. Same CSV is used for both rasters
  # — the v2.6 and v2.7 inline paths share this geography.
  section_locations:
    uri: ./data/section_locations.csv
    crs: EPSG:4326
    # buffer_m: 0 → point-sample (fastest; one pixel per section).
    # Set this to e.g. 100 to average pixel SI inside a 100 m riparian
    # buffer (needs all_touched=True under the hood; v2.7.1 handles it).
    buffer_m: 0

hydrodynamics:
  backend: builtin-1d
  cfl: 0.4
  builtin_1d:
    scheme: preissmann
  boundaries:
    upstream:
      type: discharge
      series: ../../data/lemhi/Q_2024.csv
    downstream:
      type: rating-curve
      ref: ../../data/lemhi/rating_curve.parquet

habitat:
  species: [oncorhynchus_mykiss]
  stages: [spawning, fry]
  metric: wua-q
  composite: min                       # the depth × velocity CSI composite
  scale: cell
  # v2.4.0: opt in to the per-cell composite path so the v2.6/v2.7
  # thermal/cover per-section arrays flow through apply_overlay_per_cell.
  composite_overlay_method: geom_mean_per_cell

output:
  dir: ./out/composite_hsi_demo/
  formats: [csv, parquet]
  vars: [water_depth, velocity_magnitude, wua, hsi_depth, hsi_velocity]

provenance:
  emit: true
