name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run lint
      - run: pixi run -- ruff format --check src/ tests/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      # The strict gate. This is the type-checking half of `pixi run check`
      # (typecheck-strict-core + typecheck-strict-gui); `check` itself is not
      # invoked here because its `lint` and `test` members already have their
      # own jobs below, and `test` runs a 3-OS x 2-Python matrix.
      - run: pixi run typecheck-strict
      # Non-strict sweep over the whole package. Redundant with the above for
      # core + GUI, but it is the only default-environment check that covers
      # src/openlimno/qgis/, which ADR-0011 keeps out of the strict default.
      - run: pixi run typecheck

  schema-validation:
    name: WEDM schema self-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run validate-schemas

  test:
    name: Test (${{ matrix.os }} / Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run test-cov
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark-fast:
    name: Benchmark (fast subset, every PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run benchmark-mms
      - run: pixi run benchmark-toro
      - run: pixi run benchmark-phabsim

  hecras-interoperability:
    name: HEC-RAS interop real fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run pytest tests/integration/test_hecras_real_fixtures.py -q
        env:
          OPENLIMNO_RUN_HECRAS_REAL: "1"
          OPENLIMNO_HECRAS_FIXTURE_DIR: ${{ runner.temp }}/openlimno_hecras_fixtures

  river2d-interoperability:
    name: River2D interop real fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run pytest tests/integration/test_river2d_real_fixtures.py -q
        env:
          OPENLIMNO_RUN_RIVER2D_REAL: "1"
          OPENLIMNO_RIVER2D_FIXTURE_DIR: ${{ runner.temp }}/openlimno_river2d_fixtures

  mike-interoperability:
    name: MIKE interop real fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: mike
          cache: true
      - run: pixi run -e mike openlimno preprocess diagnose-model --source mike-1d --strict
      - run: pixi run -e mike pytest tests/integration/test_mike_real_fixtures.py -q
        env:
          OPENLIMNO_RUN_MIKE_REAL: "1"
          OPENLIMNO_MIKE_FIXTURE_DIR: ${{ runner.temp }}/openlimno_mike_fixtures

  telemac-interoperability:
    name: TELEMAC interop real fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run pytest tests/integration/test_telemac_real_fixtures.py tests/integration/test_telemac_public_wua_example.py -q
        env:
          OPENLIMNO_RUN_TELEMAC_REAL: "1"
          OPENLIMNO_TELEMAC_FIXTURE_DIR: ${{ runner.temp }}/openlimno_telemac_fixtures

  netcdf-interoperability:
    name: CF/UGRID NetCDF interop real fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run pytest tests/integration/test_netcdf_real_fixtures.py tests/integration/test_netcdf_public_wua_example.py -q
        env:
          OPENLIMNO_RUN_NETCDF_REAL: "1"
          OPENLIMNO_NETCDF_FIXTURE_DIR: ${{ runner.temp }}/openlimno_netcdf_fixtures

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: docs
          cache: true
      - run: pixi run -e docs docs-build

  spec-scope-check:
    name: SPEC scope discipline check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.67.2
          environments: default
          cache: true
      - run: pixi run -- python tools/m0_checklist/spec_scope_check.py src/openlimno/

  ci-success:
    name: CI success gate
    needs: [lint, typecheck, schema-validation, test, benchmark-fast, hecras-interoperability, river2d-interoperability, mike-interoperability, telemac-interoperability, netcdf-interoperability, docs, spec-scope-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
