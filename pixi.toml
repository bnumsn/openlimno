[workspace]
name = "openlimno"
version = "3.6.1"
description = "Open-source ecological-flow and fish-habitat decision platform"
authors = ["OpenLimno Contributors <hello@openlimno.org>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
license = "Apache-2.0"
license-file = "LICENSE"
homepage = "https://openlimno.org"
repository = "https://github.com/openlimno/openlimno"

# ---------------------------------------------------------------
# Core runtime dependencies (1.0 minimal)
# ---------------------------------------------------------------
[dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26"
pandas = ">=2.2"
xarray = ">=2024.1"
netcdf4 = ">=1.6"
pyarrow = ">=15"
pyproj = ">=3.6"
shapely = ">=2.0"
geopandas = ">=0.14"
rasterio = ">=1.3"
fiona = ">=1.9"
matplotlib = ">=3.8"
h5py = ">=3.10"
pyyaml = ">=6"
"ruamel.yaml" = ">=0.18"  # v3.3.0 R13-3: comment-preserving YAML round-trip
jsonschema = ">=4.21"
click = ">=8.1"
rich = ">=13"
openpyxl = ">=3.1"        # for read_cross_sections / read_fish_sampling Excel input

# Mesh tooling
gmsh = ">=4.12"
triangle = "*"            # Conda recipe; for non-conda fallbacks see ADR-0003

# IFIM / habitat numerical helpers
scipy = ">=1.12"

# Workflow + calibration
# snakemake-minimal: moved to [feature.workflow] (osx-arm64 wheels missing
# from conda-forge as of 2026-Q2; users who need Snakefile execution opt in
# via `pixi install -e workflow`). Core OpenLimno does not import snakemake.
# pestpp: the OpenLimno-to-PEST++ workspace translator is local code. The
# external PEST++ runner/container remains research-route infrastructure, so
# no binary dependency is bundled in the default environment.

# ---------------------------------------------------------------
# Optional integrations (1.0 wraps these via subprocess)
# ---------------------------------------------------------------
# SCHISM feature: the Fortran binary is NOT distributed via conda-forge
# (ADR-0002) — OpenLimno calls SCHISM via the
# `ghcr.io/bnumsn/schism:5.11.0` OCI container. No additional Python
# packages are required; the SCHISMAdapter is a pure subprocess wrapper.
# (pyschism on PyPI depends on pygeos which is EOL; users can install
# pyschism manually if they need its convenience helpers.)
[feature.schism.dependencies]
# Intentionally empty — SCHISM is a subprocess/container dependency, not
# a Python dependency.

[feature.qgis.dependencies]
# QGIS plugin runs in QGIS's own Python; this feature is for development testing only.
qgis = ">=3.34"

[feature.osgeo.dependencies]
# GDAL's Python bindings expose the ``osgeo`` package used by HydroSHEDS
# and parquet OGR fallback tests. Keep them out of the default env because
# rasterio/fiona cover normal runtime paths without importing ``osgeo``.
gdal = ">=3.8"

# ---------------------------------------------------------------
# Development / test / docs
# ---------------------------------------------------------------
[feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pytest-regressions = ">=2"
hypothesis = ">=6"
ruff = ">=0.4"
mypy = ">=1.10"
pre-commit = ">=3.7"
# Studio JS assets live in src/openlimno/*/assets/*.js and are syntax-checked
# by tests/unit/test_studio_assets_extraction.py via `node --check`. Cheap
# enough to belong in the default env so the gate is real on every matrix job.
nodejs = ">=20"

# Studio JS execution tests (Playwright + headless Chromium). Kept out of the
# default env so the 3-OS x 2-Python matrix stays light; the browser itself is
# fetched by `playwright install chromium`, not by conda.
[feature.browser.dependencies]
playwright = ">=1.44"

[feature.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = ">=0.25"
mkdocstrings-python = ">=1.10"

# Snakemake feature — installed via PyPI (snakemake is on bioconda for conda
# users but PyPI is universal). Use `pixi install -e workflow` to opt in.
# Workflow-marked tests are outside the default gate; run `test-workflow`
# in the workflow environment to exercise them.
[feature.workflow.pypi-dependencies]
snakemake = ">=8"

[feature.pestpp.dependencies]
pestpp = ">=5.2"

[feature.mike]
platforms = ["linux-64", "win-64"]

[feature.mike.dependencies]
dotnet-runtime = ">=8,<9"

[feature.mike.pypi-dependencies]
mikeio = ">=3.1"
mikeio1d = ">=1.1"

# OpenLimno itself, installed in editable mode so src/openlimno is importable
# inside the pixi env (CI uses `pixi run -- pytest`, which expects this).
[pypi-dependencies]
openlimno = { path = ".", editable = true }

# Activation env: isolate from the host's `~/.local/lib/python*/site-packages`
# so a user's stale pip-installed packages don't leak into the pixi env.
[activation.env]
PYTHONNOUSERSITE = "1"

# ---------------------------------------------------------------
# Environments
# ---------------------------------------------------------------
[environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
schism = { features = ["dev", "schism"], solve-group = "schism" }
qgis = { features = ["dev", "qgis"], solve-group = "qgis" }
osgeo = { features = ["dev", "osgeo"], solve-group = "osgeo" }
workflow = { features = ["dev", "workflow"], solve-group = "workflow" }
pestpp = { features = ["dev", "pestpp"], solve-group = "pestpp" }
mike = { features = ["dev", "mike"], solve-group = "mike" }
browser = { features = ["dev", "browser"], solve-group = "browser" }
all = { features = ["dev", "docs", "schism"], solve-group = "all" }

# ---------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------
[tasks]
test = 'pytest tests/ benchmarks/_compare -v -m "not online and not qgis and not osgeo and not pestpp and not workflow"'
test-all = "pytest tests/ benchmarks/_compare -v"
test-online = "pytest tests/integration -v -m online"
test-osgeo = "pytest tests/unit/test_preprocess_fetch.py tests/unit/test_xs_rows_cache.py -v -m osgeo"
test-qgis = "pytest tests/integration/test_qgis_plugin_shim.py -v"
studio-browser-install = "playwright install chromium"
test-studio-assets = "pytest tests/unit/test_studio_assets_extraction.py -q"
test-studio-browser = "pytest tests/unit/test_studio_browser.py -q"
test-workflow = "pytest tests/integration/test_snakemake_calibrate.py -v -m workflow"
test-pestpp = "pytest tests/integration/test_pestpp_glm_real.py -v -m pestpp"
test-cov = 'pytest tests/ --cov=src/openlimno --cov-report=term-missing --cov-report=xml -m "not online and not qgis and not osgeo and not pestpp and not workflow"'
# CI's "Lint & format" job runs `ruff check` AND `ruff format --check`.
# Until v3.6.1-post only the first was in this task, so `pixi run check`
# could pass locally while CI failed on formatting. Both live here now, so
# the local gate is not a subset of the CI gate.
lint = { depends-on = ["lint-check", "format-check"] }
lint-check = "ruff check src/ tests/ benchmarks/_compare"
format-check = "ruff format --check src/ tests/"
lint-fix = "ruff check --fix src/ tests/ benchmarks/_compare"
format = "ruff format src/ tests/"
# Non-strict sweep over the whole package. Mostly redundant with the strict
# tasks, but NOT entirely: it is the only default-environment type check that
# covers src/openlimno/qgis/ (kept out of the strict default by ADR-0011), so
# CI keeps running it next to ``typecheck-strict``.
typecheck = "mypy src/openlimno"
# The Qt/GUI layer is excluded here and picked up by ``typecheck-strict-gui``
# below, which relaxes exactly the checks that untyped PySide6/matplotlib
# backends make impossible.
typecheck-strict-core = 'mypy --strict src/openlimno --exclude "src/openlimno/(gui_core|studio|qgis|fishtank/desktop)/"'
# v3.6.1-post: QGIS plugin is maintenance-only (see
# src/openlimno/qgis/openlimno_qgis_plugin/MAINTENANCE_ONLY.md + ADR-0011).
# Default ``check`` covers Studio (gui_core + studio) and the fishtank
# desktop app; QGIS is opt-in via ``typecheck-strict-qgis`` for PRs that
# actually touch qgis/.
# fishtank/desktop belongs in this bucket for the same reason gui_core and
# studio do: it subclasses matplotlib's FigureCanvasQTAgg, whose ``__init__``
# and ``draw_idle`` are untyped, so every call to them trips
# ``no-untyped-call`` under bare --strict. gui_core/controller.py constructs
# the very same canvas class and is already covered by --allow-untyped-calls.
typecheck-strict-gui = "mypy --strict src/openlimno/gui_core src/openlimno/studio src/openlimno/fishtank/desktop --ignore-missing-imports --allow-untyped-decorators --allow-untyped-calls"
typecheck-strict-qgis = "mypy --strict src/openlimno/qgis --ignore-missing-imports --allow-untyped-decorators --allow-untyped-calls"
# The default strict gate, in one task: what ``check`` enforces and what CI's
# typecheck job runs. Use this locally to reproduce the CI type gate.
typecheck-strict = { depends-on = ["typecheck-strict-core", "typecheck-strict-gui"] }
# Back-compat alias so existing scripts / CI / hooks that call the old
# task name don't break. Remove after the next maintainer sync.
typecheck-strict-gui-qgis = { depends-on = ["typecheck-strict-gui", "typecheck-strict-qgis"] }
validate-schemas = "python -m openlimno.wedm.validate_schemas"
docs-serve = { cmd = "mkdocs serve", env = { ENVIRONMENT = "default" } }
docs-build = "mkdocs build --strict"
benchmark-mms = "pytest benchmarks/mms -v"
benchmark-toro = "pytest benchmarks/toro -v"
benchmark-phabsim = "pytest benchmarks/phabsim_bovee1997 -v"
benchmark-all = { depends-on = ["benchmark-mms", "benchmark-toro", "benchmark-phabsim"] }

# Pre-commit hook: composite quality gate
# v2.5.1 (R8-4): dropped redundant base ``typecheck`` (non-strict
# ``mypy src/openlimno``). At the time the two strict tasks together
# covered every file in src/openlimno under stricter rules, so the
# non-strict pass was pure churn.
# v3.6.1-post: QGIS strict-typing moved out of default (maintenance-only
# per ADR-0011). ``check`` now covers core + Studio + the fishtank desktop
# app — i.e. everything except src/openlimno/qgis/, which the v2.5.1 note
# above no longer holds for. PRs that touch qgis/ should additionally run
# ``pixi run typecheck-strict-qgis``; CI keeps the non-strict ``typecheck``
# sweep so qgis/ is not left completely unchecked.
check = { depends-on = ["lint", "typecheck-strict", "test", "validate-schemas"] }
